# Fifty judged queries. The Definition of Done for M2 §2 and §3.
#
# Each query names the documents that answer it. Recall@10 is the fraction of those that appear
# in the first ten results, averaged over queries — so a query with one right answer scores 1 or
# 0, and one with two scores 0, 0.5 or 1.
#
# `kind` is what the query is *testing*, and it is why this file is worth more than a number:
#
# - `name`      the file is asked for by its name. The path arm should answer without help.
# - `lexical`   the words of the query are in the document. BM25 territory.
# - `semantic`  the answer shares few or no content words with the question. Only the vector arm
#               can find these, and their score is what the model is worth.
# - `crosslang` the question is in one language and the answer in the other. This is the whole
#               reason D6 chose a multilingual model, and the number that decides whether it was
#               the right call.
#
# `lang` is the language the **query** is written in, never the document's. That distinction is
# the whole comparison: "German queries perform within ten per cent of English queries" is about
# what the person typed. For a cross-language query the target's language is implied by `kind`.
#
# The German and English halves are deliberately parallel in difficulty — the same kinds of
# question in the same proportions — because M2 §3 requires German to stay within ten per cent of
# English, and that comparison is meaningless if one half is harder than the other.

