[workspace]
resolver = "2"
members = [
    "crates/cortex-core",
    "crates/cortex-store",
    "crates/cortex-rpc",
    "crates/cortexd",
    "crates/cortex-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/hippocampus-fm/hippocampus"
description = "A memory daemon for your filesystem, and the file manager that grew out of it."

[workspace.dependencies]
cortex-core = { path = "crates/cortex-core" }
cortex-store = { path = "crates/cortex-store" }
cortex-rpc = { path = "crates/cortex-rpc" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time", "fs"] }
rusqlite = { version = "0.37", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
etcetera = "0.10"
blake3 = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Benchmarks must measure the code we ship, but with debug info so profiles are readable.
[profile.bench]
inherits = "release"
debug = true
strip = "none"
