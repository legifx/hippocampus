# The gates, run by a machine.
#
# Until 2026-09-05 nothing ran them: `cargo test`, `npm test`, the Playwright suites and
# `bench-latency` executed only when a person or an agent remembered to type them, and the
# hygiene gate was red for a day at a commit the progress file recorded as green. A gate nobody
# runs is a comment. This file is what makes "done" in the milestone table a machine-checked fact
# rather than an act of memory.
#
# Two kinds of job, deliberately:
#   - `rust`, `ui`: on every push and pull request. Correctness, not latency.
#   - `latency`: on demand. The budgets in docs/01-BUILD-PROMPT.md are P95 on an idle machine of
#     the reference class, and a number taken on a shared runner under unknown load does not
#     count — the project has a recorded case of three sessions optimising something that was
#     never slow. Run it on a self-hosted runner or by hand, and record the result.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      latency:
        description: "Also run bench-latency (needs an idle machine; the numbers are otherwise meaningless)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # Warnings are reported, not fatal: the workspace carried seventeen dead-code warnings on the
  # day this file was written, and a gate that is red on arrival is a gate that gets ignored.
  # Make it `-D warnings` once they are gone.

jobs:
  rust:
    name: rust — fmt, clippy, tests, hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The hygiene gate scans every patch in the history, not only the tree.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries the Tauri shell and the previewer link against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev pkg-config libdbus-1-dev libudev-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - name: cargo test --workspace
        run: |
          cargo test --workspace --no-fail-fast 2>&1 | tee test.log
          # Count by summing every `test result:` line — never by reading the tail. The progress
          # document records a session lost to exactly that mistake.
          awk '/^test result/ {p+=$4; f+=$6} END {printf "passed: %d failed: %d\n", p, f; exit (f>0)}' test.log

  ui:
    name: ui — vitest, Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            ui-agent/package-lock.json
      - run: npm ci
        working-directory: ui-agent
      - run: npm ci
        working-directory: ui
      - name: unit tests
        # The script pins NODE_ENV=test itself; the variable here is belt and braces for a runner
        # whose image exports production.
        run: NODE_ENV=test npm test
        working-directory: ui
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - name: browser tests against the fixture
        run: npm run test:ui
        working-directory: ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report
          retention-days: 7

  latency:
    name: latency gates (on demand, idle machine only)
    if: github.event_name == 'workflow_dispatch' && inputs.latency
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      - name: generate the reference corpus
        run: bash bench/corpus/generate.sh
      - name: the gates
        run: cargo run --release -q -p bench-latency -- --corpus bench/corpus/data/standard
