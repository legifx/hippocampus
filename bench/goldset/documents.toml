text = """
# Urlaubsplanung für den Sommer

Zwei Wochen im August sind fast vollständig blockiert, weil vier Leute gleichzeitig weg sind.
Die Bereitschaft ist in dieser Zeit nicht besetzt.

Vorschlag: eine der beiden Wochen entzerren, indem zwei Termine um sieben Tage verschoben
werden. Damit bleibt in jeder Woche jemand da, der im Notfall erreichbar ist.
"""

[[document]]
id = "reisekosten"
lang = "de"
path = "Dokumente/finanzen/reisekosten-erstattung.md"
text = """
# Erstattung von Reisekosten

Belege müssen im Original eingereicht werden, ein Foto reicht nur bei Beträgen unter zwanzig
Euro. Die Bahnfahrt wird vollständig erstattet, das Auto mit einer Pauschale pro Kilometer.

Übernachtungen werden bis zu einer Obergrenze übernommen; alles darüber muss vorher abgestimmt
sein. Verpflegung läuft über die Tagespauschale und nicht über einzelne Rechnungen.
"""

[[document]]
id = "backup-restore"
lang = "en"
path = "Projects/infrastructure/restore-drill.md"
text = """
# What the restore drill found

The backup had been running for months and nobody had ever read one back. It turned out the
job was writing an empty archive whenever the source directory was busy, so roughly one night
in five produced nothing at all.

The backup itself reported success every time, which is the part worth remembering: a job that
only checks whether it finished is not checking anything.
"""

[[document]]
id = "wasserschaden"
lang = "de"
path = "Dokumente/wohnung/wasserschaden-versicherung.md"
text = """
# Wasserschaden im Bad

Der Schaden kam von der Leitung hinter der Wand, nicht vom Silikon an der Wanne. Das ist für
die Versicherung der entscheidende Unterschied: das eine ist ein Rohrbruch und gedeckt, das
andere wäre Instandhaltung gewesen.

Der Trockner läuft jetzt drei Wochen. Die Rechnung geht direkt an die Versicherung, wir müssen
nichts vorstrecken.
"""

[[document]]
id = "rust-lifetimes"
lang = "en"
path = "Projects/notes/borrow-checker.md"
text = """
# The borrow checker was right again

The error was not about lifetimes at all. Holding the lock across the await point meant the
value had to outlive a suspension the compiler could not reason about, and the fix was to copy
the two fields that were actually needed and drop the guard before the call.

Every time this looks like the compiler being awkward, it has turned out to be a design that
kept something alive longer than it needed to be.
"""

[[document]]
id = "gartenbewaesserung"
lang = "de"
path = "Notizen/garten/bewaesserung.md"
text = """
# Bewässerung im Sommer

Zweimal die Woche gründlich ist besser als jeden Tag ein bisschen. Bei täglichem Gießen
bleiben die Wurzeln flach und die Pflanzen halten keine drei heißen Tage ohne Wasser durch.

Am frühen Morgen gießen, nicht abends: über Nacht bleibt es zu lange feucht und die Schnecken
finden alles.
"""

[[document]]
id = "meeting-notes-roadmap"
lang = "en"
path = "Documents/meetings/roadmap-2026-q1.md"
text = """
# Roadmap discussion, first quarter

Two things were agreed. The migration is moved ahead of the redesign, because the redesign
depends on it and doing them in the other order would mean building the same screens twice.

The second decision is that nothing else gets added before the migration is finished. Every
previous attempt failed at exactly this point, and always for the same reason.
"""

[[document]]
id = "schluesseldienst"
lang = "de"
path = "Notizen/haushalt/schluesseldienst-rechnung.md"
text = """
# Rechnung vom Schlüsseldienst

Die Tür war nur zugefallen, nicht abgeschlossen — das ist der billigste Fall und war trotzdem
teuer, weil es Sonntag war. Der Zuschlag für Wochenende und Nacht macht mehr aus als die
eigentliche Arbeit.

Beim nächsten Mal zuerst bei den Nachbarn klingeln, dort liegt ein Zweitschlüssel.
"""

[[document]]
id = "unit-test-flake"
lang = "en"
path = "Projects/testing/flaky-test-hunt.md"
text = """
# Chasing a test that failed once a week

The test was not flaky; the clock was. It compared a timestamp written by one thread with one
read by another, and on a machine under load the two could be a millisecond apart in the wrong
direction.

Passing the time in as a parameter made the test deterministic and also made the production
code easier to reason about, which is usually how this ends.
"""

[[document]]
id = "kuendigung-vertrag"
lang = "de"
path = "Dokumente/vertraege/kuendigung-fristen.md"
text = """
# Fristen für die Kündigung

Der Vertrag verlängert sich automatisch um ein Jahr, wenn nicht drei Monate vor Ablauf
gekündigt wird. Maßgeblich ist der Eingang beim Anbieter, nicht das Datum auf dem Schreiben.

Schriftlich per Einschreiben ist die sichere Variante; per E-Mail ist zwar zulässig, aber im
Streitfall schwer nachzuweisen.
"""

[[document]]
id = "photo-backup-workflow"
lang = "en"
path = "Documents/photography/import-workflow.md"
text = """
# Import workflow for a shoot

Cards are copied twice before anything is deleted: once to the working drive and once to the
slow disk that never gets edited. Only after both copies verify does the card get formatted,
and it gets formatted in the camera rather than on the computer.

The step people skip is the verification, and it is the only step that makes the second copy
worth having.
"""

[[document]]
id = "heizung-thermostat"
lang = "de"
path = "Notizen/haushalt/heizung-einstellen.md"
text = """
# Heizung richtig einstellen

Das Ventil ganz aufzudrehen macht den Raum nicht schneller warm, sondern nur wärmer als
gewollt. Die Zahl am Thermostat ist eine Zieltemperatur, kein Tempo.

Nachts absenken lohnt sich nur bei gut gedämmten Räumen; sonst kostet das Aufheizen am Morgen
mehr, als die Nacht gespart hat.
"""

[[document]]
id = "api-pagination"
lang = "en"
path = "Projects/api/pagination-design.md"
text = """
# Paging that survives inserts

Offset paging breaks as soon as rows are added while somebody is reading: page two shows a row
that was already on page one, and one row is never seen at all.

Keyset paging — remember the last key and ask for what comes after it — has neither problem
and is also faster, because the database can seek instead of counting past the rows it is
skipping.
"""

[[document]]
id = "vortrag-vorbereitung"
lang = "de"
path = "Dokumente/vortraege/vorbereitung-notizen.md"
text = """
# Vorbereitung für den Vortrag

Zwanzig Minuten sind kürzer als sie klingen. Drei Aussagen reichen; alles andere ist Material
für Fragen danach.

Die Folien werden zuletzt gebaut, nicht zuerst — sonst bestimmt die Gliederung der Folien den
Inhalt, und das merkt man dem Ergebnis an.
"""

[[document]]
id = "kaffeemaschine-entkalken"
lang = "de"
path = "Notizen/kueche/entkalken.md"
text = """
# Entkalken

Alle zwei Monate, auch wenn die Anzeige noch nichts sagt — die Anzeige zählt Durchläufe und
nicht die Härte des Wassers. Hier ist es hart, also lieber öfter.

Nach dem Entkalken zweimal nur mit Wasser durchlaufen lassen, sonst schmeckt der erste Kaffee
danach eindeutig nach Essig.
"""

[[document]]
id = "monitoring-alerts"
lang = "en"
path = "Projects/operations/alert-fatigue.md"
text = """
# Turning down the noise

Half the alerts fired every night and nobody looked at any of them, which meant the two that
mattered were invisible. Deleting the ones that had never once led to an action took the
nightly volume from forty to three.

An alert that does not change what somebody does is not information, it is a habit.
"""
