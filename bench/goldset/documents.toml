# The goldset corpus: documents that mean something.
#
# The benchmark corpus is Zipfian word salad on purpose — it reproduces the *statistics* of text,
# which is what latency depends on. Relevance does not work that way. A judgement of "this
# document answers that question" needs documents that answer questions, so the goldset brings
# its own, and the generated corpus around them becomes the distractor set.
#
# Rules these documents follow, each for a reason:
#
# - **Unique topics.** If two documents covered the same ground, "the right answer" would be
#   ambiguous and recall would measure the judgement rather than the system.
# - **German and English, and pairs across them.** The project's whole corpus is mixed, and D6
#   chose a multilingual model for it. Parallel documents are what make cross-lingual recall
#   measurable rather than assumed.
# - **Some answers share no word with their question.** Those are the ones only the vector arm
#   can find, and they are how the goldset says what the model is worth.
# - **Some are findable by name alone.** The path arm is ninety per cent of real use; a goldset
#   that only measured content would happily accept a regression there.
#
# Paths are relative to the goldset corpus root and are part of the fixture: several queries are
# about the name rather than the contents.

[[document]]
id = "speicherkosten"
lang = "de"
path = "Projekte/infrastruktur/speicherkosten-2026.md"
text = """
# Speicherkosten nach der Archivmigration

Nach der Umstellung auf das neue Archiv sind die monatlichen Ausgaben deutlich schneller
gestiegen als geplant. Der Hauptgrund ist, dass die alten Sicherungen weiterhin vorgehalten
werden, obwohl sie nach dem Umzug niemand mehr braucht.

Wir haben drei Möglichkeiten geprüft: die doppelten Sicherungen löschen, sie auf langsamere
Medien verschieben, oder die Aufbewahrungsfrist von zwölf auf sechs Monate verkürzen. Die
zweite Variante spart am meisten, ohne dass jemand auf etwas verzichten muss.

Die Entscheidung fällt im nächsten Quartal. Bis dahin bleibt der Posten im Haushalt
unverändert stehen.
"""

[[document]]
id = "storage-costs"
lang = "en"
path = "Projects/infrastructure/storage-costs-2026.md"
text = """
# Storage costs after the archive migration

Monthly spending rose considerably faster than planned once the new archive went live. The
main reason is that the old backups are still being kept, although nobody has needed them
since the move.

We looked at three options: delete the duplicated backups, move them to slower media, or
shorten the retention period from twelve months to six. The second saves the most without
anybody losing access to anything.

The decision is due next quarter. Until then the line item stays in the budget unchanged.
"""

[[document]]
id = "kamerawinkel"
lang = "de"
path = "Dokumente/aufnahmen/kamerawinkel-vergleich.md"
text = """
# Vergleich der Kamerawinkel

Die drei Montagepositionen wurden über eine Woche hinweg verglichen. Die mittlere Position
liefert die ruhigste Bildwirkung, weil die Blickachse dort über die gesamte Sequenz konstant
bleibt und der Horizont nicht wandert.

Die obere Position zeigt mehr vom Umfeld, kippt aber bei jeder Erschütterung sichtbar. Die
untere Position ist unbrauchbar, sobald sich jemand vor dem Gerät bewegt.

Für die nächste Aufnahme bleibt es bei der mittleren Position.
"""

[[document]]
id = "camera-angles"
lang = "en"
path = "Documents/recordings/camera-angle-comparison.md"
text = """
# Comparing the camera angles

The three mounting positions were compared over the course of a week. The middle position
gives the steadiest image, because the line of sight stays constant across the whole sequence
and the horizon does not drift.

The upper position shows more of the surroundings but tilts visibly with every vibration. The
lower position is useless as soon as somebody moves in front of the device.

The next recording stays with the middle position.
"""

[[document]]
id = "puffer"
lang = "de"
path = "Projekte/sensorik/pufferverhalten.md"
text = """
# Warum Bilder verloren gehen

Die Verarbeitungskette verwirft Bilder, sobald der Zwischenspeicher schneller volläuft als er
geleert wird. Das passiert nicht bei hoher Last allein, sondern immer dann, wenn das Schreiben
auf die Platte kurz stockt — dann staut sich alles auf.

Ein größerer Zwischenspeicher verschiebt das Problem nur. Wirksam war stattdessen, das
Schreiben zu bündeln und die Kette bei Rückstau kurz anzuhalten, statt weiter anzunehmen was
sie nicht wegschreiben kann.
"""

[[document]]
id = "quartalspruefung"
lang = "de"
path = "Dokumente/finanzen/quartalspruefung-notizen.md"
text = """
# Notizen zur Quartalsprüfung

Die Freigabe des Haushalts hängt weiterhin an der Prüfung. Zwei Positionen sind offen: die
Reisekosten aus dem Frühjahr, für die Belege fehlen, und die Lizenzen, die versehentlich
doppelt gebucht wurden.

Beides ist inhaltlich unstrittig und muss nur noch sauber dokumentiert werden. Sobald das
erledigt ist, wird der Rest freigegeben.
"""

[[document]]
id = "onboarding"
lang = "en"
path = "Documents/team/onboarding-checklist.md"
text = """
# Onboarding checklist

A new colleague needs three things on the first day: an account, a machine, and somebody who
answers questions without being asked twice. The first two take an hour; the third is what
decides whether the first week is useful.

Pair them with one person rather than the team. A named contact gets asked; a group does not.

Everything else — access to the shared drives, the calendar invitations, the door badge — can
follow in the first week without anybody being blocked.
"""

[[document]]
id = "einarbeitung"
lang = "de"
path = "Dokumente/team/einarbeitung-checkliste.md"
text = """
# Checkliste für die Einarbeitung

Neue Kolleginnen und Kollegen brauchen am ersten Tag drei Dinge: einen Zugang, ein Gerät und
jemanden, der Fragen beantwortet, ohne zweimal gefragt zu werden. Die ersten beiden dauern eine
Stunde; das dritte entscheidet, ob die erste Woche etwas bringt.

Eine feste Ansprechperson ist besser als das ganze Team. Eine benannte Person wird gefragt,
eine Gruppe nicht.

Alles Weitere — Zugriff auf die Ablagen, Termine, der Ausweis für die Tür — kann in der ersten
Woche folgen, ohne dass jemand aufgehalten wird.
"""

[[document]]
id = "fahrradkette"
lang = "de"
path = "Notizen/werkstatt/fahrrad-wartung.md"
text = """
# Wartung am Rad

Die Kette springt beim Antritt unter Last. Ursache war nicht die Kette selbst, sondern ein
verschlissenes Ritzel, das die Glieder nicht mehr sauber führt. Mit neuer Kette auf altem
Ritzel wird es schlimmer statt besser, weil die neue Kette nicht in die eingelaufenen Zähne
passt.

Beides zusammen tauschen, dann hält es wieder ein paar tausend Kilometer.
"""

[[document]]
id = "sauerteig"
lang = "de"
path = "Notizen/kueche/sauerteig-protokoll.md"
text = """
# Sauerteig, dritter Versuch

Der Ansatz geht deutlich besser, seit er wärmer steht. Bei Raumtemperatur passierte zwei Tage
lang nichts; auf dem Schrank über der Heizung verdoppelt er sich in sechs Stunden.

Das Mehl macht weniger aus als gedacht, die Temperatur fast alles. Beim Backen war der
Unterschied dann kaum noch zu sehen, aber die Krume ist gleichmäßiger geworden.
"""

[[document]]
id = "latency-budget"
lang = "en"
path = "Projects/search/latency-budget.md"
text = """
# Where the time goes in a query

Measuring a search end to end hides which part is slow. Broken down, the ranking is almost
free and the two expensive things are reading the index from disk the first time and turning
the query into something the model understands.

Everything after the first keystroke is cache-warm, which is why the second query of a session
feels instant and the first one does not. Optimising the wrong one of those is the usual
mistake.
"""

[[document]]
id = "wohnungsuebergabe"
lang = "de"
path = "Dokumente/wohnung/uebergabeprotokoll.md"
text = """
# Übergabe der Wohnung

Beim Auszug wurden zwei Mängel festgehalten: ein Riss in der Fensterbank im Schlafzimmer und
ein fehlender Schlüssel für den Keller. Der Riss war schon beim Einzug da und steht auch im
alten Protokoll, der Schlüssel ist tatsächlich verloren gegangen.

Die Kaution wird bis zur Nebenkostenabrechnung einbehalten, das ist zulässig. Der Termin für
die Endabnahme steht auf dem Kalender.
"""

[[document]]
id = "sql-index"
lang = "en"
path = "Projects/database/index-notes.md"
text = """
# Why the query got slower after adding an index

An index that covers the filter but not the ordering makes the database read every matching
row and then sort them. Adding the sort column to the index removed the sort entirely, and the
query went from hundreds of milliseconds to a few.

The lesson is that "add an index" is not a plan. Which columns, and in which order, is the
whole decision — an index in the wrong order is a scan with extra steps.
"""

