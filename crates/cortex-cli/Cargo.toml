[package]
name = "cortex-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command line client for the Cortex memory daemon."

[[bin]]
name = "cortex"
path = "src/main.rs"

[dependencies]
cortex-core.workspace = true
cortex-rpc.workspace = true
cortex-memory.workspace = true
# For the registry and the download path only — the CLI provisions the model, the daemon runs it.
cortex-embed = { workspace = true, default-features = false }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
