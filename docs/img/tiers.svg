<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380"
     font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>The four tiers: nothing is deleted, things move outward</title>
  <desc>Four concentric rings labelled Working, Short-term, Long-term and Cold. A file that stops
  being used moves outward one ring per consolidation pass. A pinned file stays in the centre.</desc>

  <rect width="100%" height="100%" rx="12" fill="#0b0e14"/>

  <!-- Colours are chosen to read on both a white and a dark page: no pure black, no pure white. -->
  <g fill="none" stroke="#6b7684" stroke-opacity="0.45">
    <circle cx="250" cy="190" r="150"/>
    <circle cx="250" cy="190" r="112"/>
    <circle cx="250" cy="190" r="74"/>
    <circle cx="250" cy="190" r="36"/>
  </g>

  <!-- Ring labels, placed along the top so they never collide with the dots. -->
  <g font-size="11" fill="#8b98ab" text-anchor="middle">
    <text x="250" y="58">Cold — path and stat only</text>
    <text x="250" y="96">Long-term</text>
    <text x="250" y="134">Short-term</text>
  </g>
  <text x="250" y="178" font-size="12" font-weight="600" fill="#e8eef8" text-anchor="middle">Working</text>

  <!-- Dots, brighter towards the middle: brightness is the tier. -->
  <g>
    <circle cx="216" cy="166" r="5" fill="#7fc4ff"/>
    <circle cx="272" cy="196" r="4" fill="#7fc4ff"/>
    <circle cx="205" cy="215" r="4.5" fill="#6aa9e0" fill-opacity="0.9"/>
    <circle cx="299" cy="160" r="4" fill="#6aa9e0" fill-opacity="0.9"/>
    <circle cx="176" cy="146" r="4" fill="#5a86ad" fill-opacity="0.8"/>
    <circle cx="322" cy="238" r="4" fill="#5a86ad" fill-opacity="0.8"/>
    <circle cx="140" cy="252" r="3.5" fill="#5f6b7a" fill-opacity="0.75"/>
    <circle cx="368" cy="122" r="3.5" fill="#5f6b7a" fill-opacity="0.75"/>
    <circle cx="120" cy="170" r="3" fill="#5f6b7a" fill-opacity="0.6"/>
    <circle cx="356" cy="286" r="3" fill="#5f6b7a" fill-opacity="0.6"/>
  </g>

  <!-- The pinned file: in the middle, ringed, immune to everything below. -->
  <circle cx="250" cy="208" r="6" fill="#6ee7a8"/>
  <circle cx="250" cy="208" r="11" fill="none" stroke="#6ee7a8" stroke-opacity="0.55" stroke-width="1.6"/>

  <!-- The one that is being forgotten. -->
  <g stroke="#e0913c" fill="none">
    <path d="M262 240 q28 26 56 44" stroke-width="1.6" stroke-dasharray="4 3"/>
    <path d="M312 279 l7 6 l-9 3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle cx="258" cy="234" r="5" fill="#e0913c"/>

  <!-- The reading, on the right. -->
  <g font-size="13" fill="#8b98ab">
    <text x="452" y="120" font-size="14" font-weight="600" fill="#e0913c">Forgetting is moving outward</text>
    <text x="452" y="146">A file nobody has opened for weeks falls</text>
    <text x="452" y="165">one ring per pass — never straight to the</text>
    <text x="452" y="184">outside, so one quiet fortnight cannot</text>
    <text x="452" y="203">bury a document.</text>

    <text x="452" y="240" font-size="14" font-weight="600" fill="#6ee7a8">A pin is an exemption</text>
    <text x="452" y="266">Not a large number competing with the</text>
    <text x="452" y="285">others. Pinned files are never moved.</text>
  </g>

  <text x="452" y="330" font-size="12" fill="#7d8895" font-style="italic">
    Nothing is ever deleted. The outer ring still knows
  </text>
  <text x="452" y="348" font-size="12" fill="#7d8895" font-style="italic">
    the file exists — it just stops carrying its content.
  </text>
</svg>
