[package]
name = "cortex-query"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Retrieval for the Cortex daemon: path index, fuzzy matching, fusion and scoring."

[dependencies]
cortex-core.workspace = true
cortex-store.workspace = true
cortex-extract.workspace = true
# For the query side of the vector arm only: cortex-query never loads a model itself, it is
# handed one that the daemon owns.
cortex-embed = { workspace = true, default-features = false }
serde.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
