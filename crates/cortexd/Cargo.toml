[package]
name = "cortexd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Cortex memory daemon."

[[bin]]
name = "cortexd"
path = "src/main.rs"

[features]
default = ["onnx"]
onnx = ["cortex-embed/onnx"]

[dependencies]
cortex-core.workspace = true
cortex-store.workspace = true
cortex-rpc.workspace = true
cortex-query.workspace = true
cortex-ingest.workspace = true
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
cortex-extract.workspace = true
cortex-embed = { workspace = true, default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Only for `setpriority`: Rust has no portable API for scheduling priority, and the extraction
# stage is required to run below everything else on the machine.
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
